{% extends "base.html" %}

{% block titulo %}Primeiro acesso - Livraria Entrelinhas{% endblock %}

{% block conteudo %}
<div class="ficha ficha-admin">
    <div class="ficha-cabecalho">
        <span>Primeiro acesso</span>
        <h1>Criar o gerente</h1>
    </div>
    <p>Ainda não existe nenhum funcionário. Crie a conta do gerente para começar a usar o sistema.</p>
    <form method="post">
        <label>Nome
            <input type="text" name="nome" value="{{ form.get('nome', '') }}" required autofocus>
        </label>
        <label>CPF
            <input type="text" name="cpf" value="{{ form.get('cpf', '') }}" placeholder="000.000.000-00" required>
        </label>
        <label>Usuário
            <input type="text" name="usuario" value="{{ form.get('usuario', '') }}" required>
        </label>
        <label>Senha (mínimo 8 caracteres)
            <input type="password" name="senha" minlength="8" required>
        </label>
        <label>Confirmar senha
            <input type="password" name="confirmar" minlength="8" required>
        </label>
        <button class="botao botao-cheio" type="submit">Criar gerente</button>
    </form>
</div>
{% endblock %}
