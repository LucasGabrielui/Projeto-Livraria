{% extends "base.html" %}

{% block titulo %}Criar conta - Livraria Entrelinhas{% endblock %}

{% block conteudo %}
<div class="ficha ficha-larga">
    <div class="ficha-cabecalho">
        <span>Novo leitor</span>
        <h1>Criar conta</h1>
    </div>
    <form method="post" class="grade-form">
        <label class="campo-inteiro">Nome completo
            <input type="text" name="nome" value="{{ form.get('nome', '') }}" required>
        </label>
        <label>CPF
            <input type="text" name="cpf" value="{{ form.get('cpf', '') }}" placeholder="000.000.000-00" required>
        </label>
        <label>Telefone
            <input type="text" name="telefone" value="{{ form.get('telefone', '') }}">
        </label>
        <label>Email
            <input type="email" name="email" value="{{ form.get('email', '') }}" required>
        </label>
        <label>Cidade
            <input type="text" name="cidade" value="{{ form.get('cidade', '') }}">
        </label>
        <label>Senha
            <input type="password" name="senha" required>
        </label>
        <label>Confirmar senha
            <input type="password" name="confirmar" required>
        </label>
        <button class="botao botao-cheio campo-inteiro" type="submit">Criar conta</button>
    </form>
    <p class="ficha-rodape">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p>
</div>
{% endblock %}
