{% extends "base.html" %}

{% block titulo %}Entrar - Livraria Entrelinhas{% endblock %}

{% block conteudo %}
<div class="ficha">
    <div class="ficha-cabecalho">
        <span>Ficha do leitor</span>
        <h1>Entrar</h1>
    </div>
    <form method="post">
        <label>Email
            <input type="email" name="email" value="{{ email }}" required autofocus>
        </label>
        <label>Senha
            <input type="password" name="senha" required>
        </label>
        <button class="botao botao-cheio" type="submit">Entrar</button>
    </form>
    <p class="ficha-rodape">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Cadastre-se</a></p>
</div>
{% endblock %}
